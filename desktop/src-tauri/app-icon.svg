<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- rounded badge -->
  <rect x="96" y="96" width="832" height="832" rx="200" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="200" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- connected-node "L": three nodes linked, evoking pooled local devices -->
  <g stroke="#e0e7ff" stroke-width="46" stroke-linecap="round" fill="none">
    <line x1="360" y1="300" x2="360" y2="660"/>
    <line x1="360" y1="660" x2="700" y2="660"/>
  </g>
  <g fill="#ffffff">
    <circle cx="360" cy="300" r="70"/>
    <circle cx="360" cy="660" r="70"/>
    <circle cx="700" cy="660" r="70"/>
  </g>
  <g fill="#4ade80">
    <circle cx="360" cy="300" r="30"/>
    <circle cx="360" cy="660" r="30"/>
    <circle cx="700" cy="660" r="30"/>
  </g>
</svg>
